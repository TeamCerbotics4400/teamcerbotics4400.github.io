<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Troubleshooting Web — Team Mexico</title>
<script>
(function () {
  try {
    var saved = localStorage.getItem("tm_theme");
    var theme = (saved === "light" || saved === "dark") ? saved :
      (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  } catch (e) {
    document.documentElement.setAttribute("data-theme", "light");
  }
})();
</script>
<style>
/* ============================================================
   TEAM MEXICO — TROUBLESHOOTING WEB — DESIGN SYSTEM v2
   Typography kept identical to v1 (Space Grotesk / Inter / IBM Plex Mono).
   New in v2: semantic theme tokens (light + adapted dark), Mexican-tech
   decorative motifs built from the logo's own visual language (circuit
   traces, stepped pyramid, gear notches, tricolor thread), expanded motion.
   ============================================================ */

:root {
  /* --- Brand literals (from colors.md, never themed) --- */
  --tm-black: #000000;
  --tm-white: #ffffff;
  --tm-red: #CE1125;
  --tm-green: #006847;
  --tm-red-tint: #DA4C5B;
  --tm-green-tint: #1F9E70; /* derived lighter step of tm-green for dark-surface legibility, same hue family */
  --tm-green-deep: #072B1D;
  --tm-red-deep: #54080F;

  --gray-50: #FAFAFA;  --gray-100: #F2F2F2; --gray-150: #EAEAEA; --gray-200: #E0E0E0;
  --gray-300: #C7C7C7; --gray-400: #9C9C9C; --gray-500: #737373; --gray-600: #545454;
  --gray-700: #363636; --gray-800: #1F1F1F; --gray-900: #121212;

  /* --- Typography (unchanged from v1) --- */
  --font-display: 'Space Grotesk', 'IBM Plex Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-body: 'Inter', 'IBM Plex Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, 'Roboto Mono', Menlo, Consolas, monospace;

  --text-xs: 0.75rem; --text-sm: 0.875rem; --text-base: 1rem; --text-md: 1.125rem;
  --text-lg: 1.375rem; --text-xl: 1.75rem; --text-2xl: 2.25rem; --text-3xl: 3rem;

  /* --- Spacing (strict 4px grid, unchanged) --- */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-6: 24px;
  --sp-8: 32px; --sp-12: 48px; --sp-16: 64px; --sp-24: 96px;

  --r-sm: 4px; --r-md: 6px; --r-lg: 8px; --r-xl: 14px; --r-chip: 999px;

  --ease-out: cubic-bezier(0.2, 0.0, 0.0, 1);
  --ease-spring: cubic-bezier(0.34, 1.2, 0.64, 1);
  --dur-fast: 160ms; --dur-med: 240ms; --dur-slow: 420ms; --dur-hero: 900ms;

  --content-max: 880px;
  --page-max: 1200px;

  /* ============================================================
     SEMANTIC THEME TOKENS — light (default)
     ============================================================ */
  --bg: var(--tm-white);
  --bg-hero-glow-a: rgba(206, 17, 37, 0.10);
  --bg-hero-glow-b: rgba(0, 104, 71, 0.09);
  --surface: var(--tm-white);
  --surface-alt: var(--gray-50);
  --surface-raised: var(--tm-white);

  --text-primary: var(--tm-black);
  --text-secondary: var(--gray-600);
  --text-tertiary: var(--gray-400);
  --text-on-accent: var(--tm-white);

  --border: 1px solid var(--gray-200);
  --border-color: var(--gray-200);
  --border-strong: 1px solid var(--tm-black);
  --border-strong-color: var(--tm-black);

  --accent: var(--tm-red);
  --accent-hover: #A90E1E;
  --accent-wash: #FFF6F6;
  --accent-wash-active: #FDECEC;
  --success: var(--tm-green);
  --success-wash: #EAF6F1;

  --shadow-sm: 0 1px 2px rgba(0,0,0,0.07);
  --shadow-md: 0 6px 20px rgba(0,0,0,0.08);
  --shadow-glow-accent: 0 0 0 3px rgba(206,17,37,0.10);

  --circuit-line: rgba(0,0,0,0.06);
  --circuit-dot: rgba(0,0,0,0.14);
  --header-bg: rgba(255,255,255,0.86);

  color-scheme: light;
}

html[data-theme="dark"] {
  --bg: #0B0B0C;
  --bg-hero-glow-a: rgba(218, 76, 91, 0.16);
  --bg-hero-glow-b: rgba(31, 158, 112, 0.14);

  --surface: #141416;
  --surface-alt: #1B1B1E;
  --surface-raised: #1A1A1D;

  --text-primary: #F5F5F5;
  --text-secondary: #A8A8AC;
  --text-tertiary: #6E6E73;
  --text-on-accent: #ffffff;

  --border: 1px solid rgba(255,255,255,0.10);
  --border-color: rgba(255,255,255,0.10);
  --border-strong: 1px solid #F5F5F5;
  --border-strong-color: #F5F5F5;

  --accent: var(--tm-red-tint);
  --accent-hover: #E9707C;
  --accent-wash: rgba(218,76,91,0.10);
  --accent-wash-active: rgba(218,76,91,0.18);
  --success: var(--tm-green-tint);
  --success-wash: rgba(31,158,112,0.12);

  --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
  --shadow-md: 0 10px 30px rgba(0,0,0,0.45);
  --shadow-glow-accent: 0 0 0 3px rgba(218,76,91,0.18);

  --circuit-line: rgba(255,255,255,0.07);
  --circuit-dot: rgba(255,255,255,0.16);
  --header-bg: rgba(11,11,12,0.82);

  color-scheme: dark;
}

@media (prefers-reduced-motion: reduce) {
  :root { --dur-fast: 1ms; --dur-med: 1ms; --dur-slow: 1ms; --dur-hero: 1ms; }
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
html, body { margin: 0; padding: 0; }

body {
  font-family: var(--font-body);
  font-size: var(--text-base);
  line-height: 1.55;
  color: var(--text-primary);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  transition: background-color var(--dur-slow) var(--ease-out), color var(--dur-slow) var(--ease-out);
}

img { max-width: 100%; display: block; }
a { color: inherit; }
button { font-family: inherit; cursor: pointer; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

.visually-hidden {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

[dir="rtl"] { text-align: right; }
[dir="rtl"] .tm-header { flex-direction: row-reverse; }
[dir="rtl"] .tm-nav { flex-direction: row-reverse; }
[dir="rtl"] .breadcrumb { flex-direction: row-reverse; }
[dir="rtl"] .breadcrumb .chev { transform: scaleX(-1); }
[dir="rtl"] .robot-card, [dir="rtl"] .search-result-row, [dir="rtl"] .gap-card { text-align: right; }
[dir="rtl"] .step-divider { transform: scaleX(-1); }

/* ============================================================
   MEXICAN-TECH DECORATIVE MOTIFS
   (built from the logo's own vocabulary — circuit trace, stepped
   pyramid, gear notch, tricolor thread — never the locked mark itself)
   ============================================================ */

.circuit-field {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0.55;
  background-image:
    linear-gradient(var(--circuit-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--circuit-line) 1px, transparent 1px);
  background-size: 42px 42px;
  mask-image: radial-gradient(ellipse 70% 60% at 50% 30%, black 0%, transparent 75%);
  -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 30%, black 0%, transparent 75%);
  transition: opacity var(--dur-slow) var(--ease-out);
}

.hero-glow {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(closest-side, var(--bg-hero-glow-a), transparent 70%) 22% 18% / 55% 55% no-repeat,
    radial-gradient(closest-side, var(--bg-hero-glow-b), transparent 70%) 80% 26% / 50% 50% no-repeat;
  filter: blur(2px);
  animation: glowBreathe 9s var(--ease-out) infinite;
}
@keyframes glowBreathe {
  0%, 100% { opacity: 0.9; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.04); }
}

.tricolor-thread {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 84px;
  height: 4px;
  margin: 0 auto;
}
.tricolor-thread span {
  flex: 1;
  height: 4px;
  border-radius: var(--r-chip);
}
.tricolor-thread .t-green { background: var(--tm-green); }
.tricolor-thread .t-white { background: var(--gray-300); }
.tricolor-thread .t-red { background: var(--tm-red); }
html[data-theme="dark"] .tricolor-thread .t-white { background: var(--gray-600); }

.step-divider {
  width: 100%;
  max-width: var(--page-max);
  margin: 0 auto;
  height: 34px;
  position: relative;
}
.step-divider svg { width: 100%; height: 100%; display: block; overflow: visible; }
.step-divider .trace-line {
  stroke: var(--circuit-line);
  stroke-width: 1;
  fill: none;
}
.step-divider .pulse-dot {
  fill: var(--accent);
  offset-path: path("M0,17 H620 L636,3 L652,31 L668,17 H1200");
  animation: pulseTravel 5.5s linear infinite;
}
@keyframes pulseTravel {
  0% { offset-distance: 0%; opacity: 0; }
  6% { opacity: 1; }
  94% { opacity: 1; }
  100% { offset-distance: 100%; opacity: 0; }
}
.step-divider .step-mark { fill: var(--text-tertiary); }

.notch-card {
  position: relative;
}
.notch-card::before,
.notch-card::after {
  content: "";
  position: absolute;
  width: 9px;
  height: 9px;
  border-color: var(--accent);
  opacity: 0;
  transition: opacity var(--dur-fast) var(--ease-out);
}
.notch-card::before {
  top: -1px; left: -1px;
  border-top: 1.5px solid var(--accent);
  border-left: 1.5px solid var(--accent);
}
.notch-card::after {
  bottom: -1px; right: -1px;
  border-bottom: 1.5px solid var(--accent);
  border-right: 1.5px solid var(--accent);
}
.notch-card:hover::before, .notch-card:hover::after,
.notch-card:focus-visible::before, .notch-card:focus-visible::after {
  opacity: 1;
}

/* ============================================================
   TOP BARS (language + theme)
   ============================================================ */
.top-controls {
  position: absolute;
  top: var(--sp-4);
  right: var(--sp-4);
  z-index: 20;
  display: flex;
  align-items: center;
  gap: var(--sp-2);
}
[dir="rtl"] .top-controls { right: auto; left: var(--sp-4); }

.lang-bar {
  display: flex;
  gap: var(--sp-1);
  background: var(--surface);
  border: var(--border);
  border-radius: var(--r-chip);
  padding: 3px;
  transition: background-color var(--dur-med) var(--ease-out), border-color var(--dur-med) var(--ease-out);
}

.lang-btn {
  border: none;
  background: transparent;
  color: var(--text-tertiary);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.04em;
  font-weight: 500;
  padding: 6px 10px;
  border-radius: var(--r-chip);
  transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-spring);
}
.lang-btn:hover { color: var(--text-primary); }
.lang-btn:active { transform: scale(0.9); }
.lang-btn[aria-pressed="true"] {
  background: var(--text-primary);
  color: var(--bg);
}

.theme-toggle {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: var(--border);
  background: var(--surface);
  color: var(--text-primary);
  flex: none;
  transition: background-color var(--dur-med) var(--ease-out), border-color var(--dur-med) var(--ease-out), transform var(--dur-fast) var(--ease-spring);
  overflow: hidden;
}
.theme-toggle:hover { transform: rotate(-14deg); }
.theme-toggle:active { transform: scale(0.88); }
.theme-toggle svg { width: 16px; height: 16px; transition: transform var(--dur-slow) var(--ease-spring), opacity var(--dur-med) var(--ease-out); }

/* ============================================================
   HERO
   ============================================================ */
.hero {
  position: relative;
  min-height: 92vh;
  min-height: 92dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: var(--sp-24) var(--sp-4) var(--sp-16);
  overflow: hidden;
  background: var(--bg);
  transition: background-color var(--dur-slow) var(--ease-out);
}

.hero-logo-wrap {
  position: relative;
  width: 132px;
  height: auto;
  margin-bottom: var(--sp-8);
}
.hero-logo {
  width: 132px;
  height: auto;
  position: relative;
  z-index: 2;
  opacity: 0;
  transform: scale(0.72) rotate(-6deg);
  animation: logoIntro var(--dur-hero) var(--ease-spring) 120ms forwards;
}
@keyframes logoIntro {
  0% { opacity: 0; transform: scale(0.72) rotate(-6deg); filter: blur(6px); }
  60% { opacity: 1; filter: blur(0); }
  100% { opacity: 1; transform: scale(1) rotate(0deg); filter: blur(0); }
}
.hero-logo-ring {
  position: absolute;
  inset: -22px;
  z-index: 1;
  border-radius: 50%;
  border: 1px dashed var(--circuit-dot);
  opacity: 0;
  transform: scale(0.8);
  animation: ringIntro var(--dur-hero) var(--ease-out) 260ms forwards, ringSpin 40s linear infinite;
}
@keyframes ringIntro { to { opacity: 1; transform: scale(1); } }
@keyframes ringSpin { to { transform: rotate(360deg); } }

.hero-eyebrow {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
  margin: 0 0 var(--sp-4);
  opacity: 0;
  animation: wordUp var(--dur-slow) var(--ease-out) 520ms forwards;
}

.hero-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(2.25rem, 6vw, 4rem);
  line-height: 1.05;
  letter-spacing: -0.02em;
  margin: 0;
  max-width: 23ch;
  color: var(--text-primary);
}
.hero-title .word {
  display: inline-block;
  opacity: 0;
  transform: translateY(16px);
  animation: wordUp var(--dur-slow) var(--ease-out) forwards;
}
.hero-subtitle {
  display: block;
  font-family: var(--font-display);
  font-weight: 500;
  font-size: clamp(1.125rem, 2.4vw, 1.5rem);
  color: var(--text-secondary);
  margin: var(--sp-2) 0 0;
  opacity: 0;
  animation: wordUp var(--dur-slow) var(--ease-out) 780ms forwards;
}
@keyframes wordUp {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}

.hero-thread-wrap {
  margin: var(--sp-4) 0 var(--sp-6);
  opacity: 0;
  animation: wordUp var(--dur-slow) var(--ease-out) 900ms forwards;
}

.hero-desc {
  max-width: 46ch;
  color: var(--text-secondary);
  font-size: var(--text-md);
  line-height: 1.6;
  margin: 0 0 var(--sp-12);
  opacity: 0;
  animation: wordUp var(--dur-slow) var(--ease-out) 1020ms forwards;
}

.scroll-cue {
  position: absolute;
  bottom: var(--sp-8);
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--sp-2);
  color: var(--text-tertiary);
  opacity: 0;
  animation: wordUp var(--dur-slow) var(--ease-out) 1180ms forwards, cueBob 2.2s var(--ease-out) 2s infinite;
}
.scroll-cue span {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}
.scroll-icon svg { transform: rotate(90deg); width: 16px; height: 16px; display: block; }
@keyframes cueBob {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(6px); }
}

/* ============================================================
   SECTIONS (scrollytelling reveal)
   ============================================================ */
.section { padding: var(--sp-24) var(--sp-4); position: relative; }
.section-inner { max-width: var(--page-max); margin: 0 auto; position: relative; z-index: 1; }
.section-narrow .section-inner { max-width: var(--content-max); }

.reveal {
  opacity: 0;
  transform: translateY(18px);
  transition: opacity var(--dur-slow) var(--ease-out), transform var(--dur-slow) var(--ease-out);
}
.reveal.is-visible { opacity: 1; transform: translateY(0); }

.reveal-stagger > * {
  opacity: 0;
  transform: translateY(14px) scale(0.98);
  transition: opacity var(--dur-med) var(--ease-out), transform var(--dur-med) var(--ease-spring);
}
.reveal-stagger.is-visible > * { opacity: 1; transform: translateY(0) scale(1); }
.reveal-stagger.is-visible > *:nth-child(1) { transition-delay: 0ms; }
.reveal-stagger.is-visible > *:nth-child(2) { transition-delay: 40ms; }
.reveal-stagger.is-visible > *:nth-child(3) { transition-delay: 80ms; }
.reveal-stagger.is-visible > *:nth-child(4) { transition-delay: 120ms; }
.reveal-stagger.is-visible > *:nth-child(5) { transition-delay: 160ms; }
.reveal-stagger.is-visible > *:nth-child(6) { transition-delay: 200ms; }
.reveal-stagger.is-visible > *:nth-child(7) { transition-delay: 240ms; }
.reveal-stagger.is-visible > *:nth-child(8) { transition-delay: 280ms; }
.reveal-stagger.is-visible > *:nth-child(9) { transition-delay: 320ms; }
.reveal-stagger.is-visible > *:nth-child(10) { transition-delay: 360ms; }

.section-kicker {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
  margin: 0 0 var(--sp-2);
}
.section-kicker .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }
.section-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(1.5rem, 3.4vw, 2.25rem);
  letter-spacing: -0.01em;
  margin: 0 0 var(--sp-3);
  color: var(--text-primary);
}
.section-lede { color: var(--text-secondary); font-size: var(--text-md); max-width: 60ch; margin: 0 0 var(--sp-8); }

/* ============================================================
   SEARCH
   ============================================================ */
.search-input-wrap {
  position: relative;
  display: flex;
  align-items: center;
  border: 1.5px solid var(--gray-300);
  border-radius: var(--r-lg);
  background: var(--surface);
  transition: border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out), background-color var(--dur-med) var(--ease-out);
}
html[data-theme="dark"] .search-input-wrap { border-color: var(--border-color); }
.search-input-wrap:focus-within { border-color: var(--accent); box-shadow: var(--shadow-glow-accent); }
.search-icon { flex: none; width: 22px; height: 22px; margin: 0 var(--sp-4); color: var(--text-tertiary); }
#searchInput {
  flex: 1; border: none; outline: none; background: transparent;
  font-family: var(--font-body); font-size: var(--text-md);
  padding: var(--sp-4) var(--sp-4) var(--sp-4) 0; color: var(--text-primary);
}
#searchInput::placeholder { color: var(--text-tertiary); }

.search-results { margin-top: var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-2); }
.search-results:empty { margin-top: 0; }

.search-result-row {
  display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3);
  width: 100%; text-align: left; padding: var(--sp-4);
  border: var(--border); border-radius: var(--r-lg); background: var(--surface);
  font-size: var(--text-base); color: var(--text-primary);
  transition: border-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out);
  animation: wordUp var(--dur-med) var(--ease-out) both;
}
.search-result-row:hover, .search-result-row:focus-visible { border-color: var(--accent); background: var(--accent-wash); }
.search-result-row:active { transform: scale(0.99); background: var(--accent-wash-active); }
.search-result-row .arrow { flex: none; width: 16px; height: 16px; color: var(--text-tertiary); transition: transform var(--dur-fast) var(--ease-out); }
.search-result-row:hover .arrow { transform: translateX(3px); color: var(--accent); }

.search-empty-hint { margin-top: var(--sp-4); color: var(--text-tertiary); font-size: var(--text-sm); }

/* ============================================================
   ROBOT INDEX GRID
   ============================================================ */
.robot-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--sp-3); }
@media (min-width: 640px) { .robot-grid { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 960px) { .robot-grid { grid-template-columns: repeat(4, 1fr); } }

.robot-card {
  display: flex; flex-direction: column; align-items: flex-start; gap: var(--sp-3);
  text-align: left; padding: var(--sp-6);
  border: var(--border); border-radius: var(--r-lg); background: var(--surface);

{
  id: "motorhex-lowpower",
  subsystem: ["motor"],
  symptom_text: { es: "El motor gira débil o pierde fuerza bajo carga", en: "The motor is weak or loses power under load" },
  tags: ["motor", "hd hex", "core hex", "poco poder", "low power", "voltaje"],
  check: {
    question: {
      es: "Cierta pérdida de velocidad bajo carga es normal en cualquier motor DC — la Velocidad Libre solo se alcanza sin carga en el eje, y baja en cuanto el motor trabaja contra una resistencia. Pero si la pérdida es exagerada, hay dos causas comunes: (1) el motor no está recibiendo suficiente voltaje porque la batería está baja, o (2) el puerto de motor se está autolimitando porque se acerca a su límite térmico. ¿Ya revisaste el estado de la batería?",
      en: "Some speed loss under load is normal for any DC motor — Free Speed is only reached with zero load on the shaft, and drops as soon as the motor works against resistance. But if the loss is excessive, there are two common causes: (1) the motor isn't getting enough voltage because the battery is low, or (2) the motor port is self-limiting because it's approaching its thermal limit. Have you already checked the battery's condition?"
    }
  },
  edges: [
    { answer: { es: "No, revisar batería", en: "No, check battery" }, next_node_id: "battery-root" },

{
  id: "motorhex-fix-thermal",
  subsystem: ["motor"],
  symptom_text: { es: "El puerto de motor se autolimita por temperatura", en: "The motor port self-limits due to temperature" },
  tags: ["motor", "sobrecorriente", "overcurrent", "termico", "thermal"],
  check: { question: { es: "Diagnóstico", en: "Diagnosis" } },
  fix: {
    steps: {
      es: "Cada puerto de motor del Control Hub soporta 10A de corriente continua y un máximo absoluto de 20A. Exceder el máximo continuo depende de varios factores térmicos, y la salida se autoprotege una vez que se acerca a su límite térmico — esto se siente como el motor 'perdiendo fuerza' sin razón aparente. La corriente máxima absoluta está limitada, en última instancia, por el fusible en línea de la batería. Si el mecanismo exige corriente sostenida cercana al máximo (por ejemplo, algo atorado o con demasiada fricción), reduce esa carga mecánica antes de asumir que el motor está dañado — es la causa raíz más común de este síntoma.",
      en: "Each Control Hub motor port supports 10A of continuous current with an absolute maximum of 20A. Exceeding the continuous maximum depends on several thermal factors, and the output self-protects once it approaches its thermal limit — this feels like the motor 'losing power' for no clear reason. The absolute maximum current is ultimately limited by the battery's in-line fuse. If the mechanism demands sustained current near the maximum (for example something jammed or with too much friction), reduce that mechanical load before assuming the motor is damaged — this is the most common root cause of this symptom."
    },
    media: [],
    est_time: "5 min",
    difficulty: "medium"
  },
  edges: [
    { answer: { es: "Se resolvió", en: "It's resolved" }, next_node_id: "END" },
    { answer: { es: "No, sigue igual", en: "No, still the same" }, next_node_id: "esc-rev-support" }
  ],
  metadata: META("REV Robotics — Control Hub Specifications (Motor Port Specifications)", true)
},

{
  id: "motorhex-overheat",
  subsystem: ["motor"],
  symptom_text: { es: "El motor se sobrecalienta o deja de funcionar tras un rato", en: "The motor overheats or stops working after a while" },
  tags: ["motor", "hd hex", "core hex", "sobrecalentamiento", "overheat", "stall torque"],
  check: { question: { es: "Diagnóstico", en: "Diagnosis" } },
  fix: {
    steps: {
      es: "El Core Hex Motor puede correr aproximadamente 4 horas continuas antes de sobrecalentarse cuando trabaja a carga de torque casi máxima (torque de estancamiento). Si tu equipo ve sobrecalentamiento en mucho menos tiempo, algo está exigiendo al motor cerca de ese máximo de forma sostenida, no en picos cortos — esto es distinto a un motor defectuoso. Cuando el motor produce más calor residual del que su cuerpo puede disipar, eventualmente se desgasta prematuramente o falla de forma espontánea. Revisa si el mecanismo está atorado, con demasiada fricción, o sosteniendo una carga estática pesada con el motor energizado (por ejemplo, un mecanismo sin freno mecánico sosteniendo peso) — reducir esa exigencia sostenida es la solución antes de reemplazar el motor.",
      en: "The Core Hex Motor can run for approximately 4 hours continuously before overheating when working at near-maximum torque loading (stall torque). If your team sees overheating in much less time, something is demanding near that maximum from the motor continuously, not in short spikes — this is different from a defective motor. When the motor produces more waste heat than its body can dissipate, it will eventually wear out prematurely or fail spontaneously. Check whether the mechanism is jammed, has too much friction, or is holding a heavy static load with the motor energized (for example, a mechanism with no mechanical brake holding weight) — reducing that sustained demand is the fix before replacing the motor."
    },
    media: [],
    est_time: "10 min",
    difficulty: "medium"
  },
  edges: [
    { answer: { es: "Se resolvió", en: "It's resolved" }, next_node_id: "END" },
    { answer: { es: "No, sigue igual", en: "No, still the same" }, next_node_id: "esc-rev-support" }
  ],
  metadata: META("REV Robotics — Motors (Preventing Premature Motor Failure)", true)
},

{
  id: "motorhex-telemetry",
  subsystem: ["motor", "reference"],
  symptom_text: { es: "Los valores de encoder/telemetría no tienen sentido", en: "Encoder/telemetry values don't make sense" },
  tags: ["motor", "encoder", "cpr", "telemetria", "telemetry", "hd hex", "core hex"],
  check: { question: { es: "Referencia", en: "Reference" } },
  fix: {
    steps: {
      es: "Antes de asumir que el encoder está dañado: la mayoría de las veces el encoder funciona perfecto y el valor solo parece raro porque no coincide con lo que el equipo esperaba. Las cuentas por rotación del eje de salida (CPR) dependen de la reducción del gearbox, no son un número fijo. Referencia oficial REV: Core Hex Motor (reducción 72:1) = 288 cuentas por rotación del eje de salida. HD Hex Motor sin gearbox = 28 cuentas. HD Hex con reducción 20:1 = 560 cuentas. HD Hex con reducción 40:1 = 1120 cuentas. Si el código del equipo asume un valor de CPR distinto al de su reducción real, el robot se pasará o se quedará corto en movimientos programados por encoder — la solución es corregir la constante en el código, no reemplazar el encoder.",
      en: "Before assuming the encoder is broken: most of the time the encoder is working perfectly and the value just looks wrong because it doesn't match what the team expected. Counts per rotation (CPR) of the output shaft depend on the gearbox reduction, they are not a fixed number. Official REV reference: Core Hex Motor (72:1 reduction) = 288 counts per rotation of the output shaft. HD Hex Motor with no gearbox = 28 counts. HD Hex with 20:1 reduction = 560 counts. HD Hex with 40:1 reduction = 1120 counts. If the team's code assumes a different CPR value than its actual reduction, the robot will overshoot or undershoot encoder-programmed movements — the fix is correcting the constant in code, not replacing the encoder."
    },
    media: [],
    est_time: "5 min",
    difficulty: "easy"
  },
  edges: [
    { answer: { es: "Se resolvió", en: "It's resolved" }, next_node_id: "END" },
    { answer: { es: "Corregí el CPR y el encoder sigue sin contar nada", en: "I fixed the CPR and the encoder still doesn't count anything" }, next_node_id: "esc-rev-support" }
  ],
  metadata: META("REV Robotics — REV Motor Encoders documentation", true)
},

{
  id: "motorhex-shaft",
  subsystem: ["motor"],
  symptom_text: { es: "Eje de salida con juego o dañado", en: "Output shaft with play or damaged" },
  tags: ["motor", "eje", "shaft", "baleros", "bearings"],
  check: { question: { es: "Diagnóstico", en: "Diagnosis" } },
  fix: {
    steps: {
      es: "La mayoría de los ejes de salida de motor no están diseñados para soportar fuerzas de empuje grandes ni fuerzas normales al eje (por ejemplo, un mecanismo montado directamente en el eje, en voladizo, sin ningún soporte adicional). Se necesitan baleros para soportar el eje cuando se esperan cargas en esas direcciones. Si tu mecanismo está montado directamente sobre el eje del motor sin un balero o soporte externo, esa es la causa más probable del juego o daño — la solución es agregar soporte estructural al eje, no reemplazar el motor primero.",
      en: "Most motor output shafts are not designed to take large thrust forces or forces normal to the shaft (for example, a mechanism mounted directly on the shaft, in a cantilever, with no additional support). Bearings need to be used to support the shaft when loads in these directions are expected. If your mechanism is mounted directly on the motor's shaft with no external bearing or support, that's the most likely cause of the play or damage — the fix is adding structural support to the shaft, not replacing the motor first."
    },
    media: [],
    est_time: "20 min",
    difficulty: "medium"
  },
  edges: [

},

{
  id: "motorhex-shockload",
  subsystem: ["motor"],
  symptom_text: { es: "Desgaste por cambio brusco de dirección bajo carga", en: "Wear from a sudden direction change under load" },
  tags: ["motor", "shock load", "torque spike", "gearbox"],
  check: { question: { es: "Diagnóstico", en: "Diagnosis" } },
  fix: {
    steps: {
      es: "Picos grandes de torque o cambios súbitos de dirección pueden causar desgaste y falla prematura de los componentes del gearbox, cuando el pico de torque excede el torque de estancamiento nominal del motor. Esto explica un motor que 'funcionaba bien y de repente quedó raro' después de un choque o cambio de dirección brusco bajo carga pesada. La recomendación oficial es usar frenado mecánico o un tope físico que absorba el impacto en vez de que lo absorba el motor — si tu mecanismo no tiene ninguno de los dos, ese es el cambio de diseño a hacer, además de revisar si el gearbox ya quedó dañado.",
      en: "Large torque spikes or sudden changes in direction can cause wear and premature failure of gearbox components, when the torque spike exceeds the motor's rated stall torque. This explains a motor that 'was working fine and suddenly went off' after an impact or a sudden direction change under heavy load. The official recommendation is to use mechanical braking or a hard stop that absorbs the impact instead of the motor — if your mechanism has neither, that's the design change to make, in addition to checking whether the gearbox is already damaged."
    },
    media: [],
    est_time: "15 min",
    difficulty: "medium"
  },
  edges: [
    { answer: { es: "Se resolvió", en: "It's resolved" }, next_node_id: "END" },

  ],
  metadata: META("REV Robotics — Motors (Preventing Premature Motor Failure)", true)
},

{

  symptom_text: { es: "Piñón del HD Hex sin gearbox no transmite fuerza", en: "Bare HD Hex pinion doesn't transmit force" },
  tags: ["motor", "hd hex", "piñon", "pinion", "gearbox", "ultraplanetary"],

{
  id: "mecanum-fix-strafe-multiplier",
  subsystem: ["drivetrain", "mecanum"],
  symptom_text: { es: "Strafe mucho más lento que avanzar", en: "Strafe much slower than driving forward" },
  tags: ["mecanum", "strafe lento", "slow strafe", "multiplicador"],
  check: { question: { es: "¿Se resolvió el problema?", en: "Was the problem solved?" } },
  fix: {
    steps: {
      es: "En un chasis mecanum, el strafe (movimiento lateral) es mecánicamente menos eficiente que avanzar de frente, porque los rodillos angulados de las llantas absorben parte de la fuerza en vez de transmitirla toda al suelo. Si tu código aplica el valor del strafe sin ajuste, el robot se sentirá notablemente más lento hacia los lados. La solución común es multiplicar el valor de strafe por un factor mayor a 1 (por ejemplo 1.1 o 1.2) antes de enviarlo a los motores, calibrando ese número de forma experimental para tu robot específico. Revisa también que los rodillos no tengan fricción excesiva o desgaste, y que el centro de gravedad no esté demasiado alto, ya que ambos empeoran este efecto.",
      en: "On a mecanum chassis, strafing (sideways movement) is mechanically less efficient than driving straight, because the wheels' angled rollers absorb part of the force instead of transmitting all of it to the ground. If your code applies the strafe value unadjusted, the robot will feel noticeably slower sideways. The common fix is multiplying the strafe value by a factor greater than 1 (for example 1.1 or 1.2) before sending it to the motors, calibrating that number experimentally for your specific robot. Also check that the rollers don't have excessive friction or wear, and that the center of gravity isn't too high, since both make this effect worse."
    },
    media: [],
    est_time: "15 min",
    difficulty: "medium"
  },
  edges: [

{
  id: "controlhub-ports-reference",
  subsystem: ["reference", "control-hub"],
  symptom_text: { es: "Referencia de puertos del Control Hub", en: "Control Hub port reference" },
  tags: ["puertos", "referencia", "xt30", "jst"],
  check: { question: { es: "Referencia", en: "Reference" } },
  fix: {
    steps: {
      es: "Puertos de batería (XT30, amarillos): nunca conectes un cargador directo, dañas el Hub. Puertos de motor (JST-VH, 4 por Hub, numerados 0-3): hasta 4 motores DC. Puertos de encoder (JST-PH 4 pines, 4 por Hub): para encoders cuadratura, usables junto al motor adyacente o con un encoder externo. Puertos de servo (0.1\" header, 6 por Hub, numerados 0-5): cuidado con la polaridad. Puertos +5V (0.1\" header, 2 por Hub): uso limitado, por ejemplo hubs USB alimentados. Puertos analógicos (JST-PH 4 pines, 2 por Hub, 4 canales cada uno): para sensores analógicos como potenciómetros. Puertos digitales (JST-PH 4 pines, 4 por Hub, 8 canales): cada puerto tiene dos canales; sensores como el Touch Sensor de REV solo usan un canal. Puertos I2C (JST-PH 4 pines): cada puerto es un bus I2C independiente; usar sensores con direcciones idénticas en el mismo bus causa problemas. RS485 (JST-PH 3 pines): comunicación serial entre Hubs REV. USB: USB 2.0 puede causar desconexiones de Wi-Fi por descarga electrostática — usa el puerto USB 3.0 para cámaras. USB-C: para programar desde laptop. Mini USB: solo para subir firmware.",
      en: "Battery ports (XT30, yellow): never plug in a charger directly, it damages the Hub. Motor ports (JST-VH, 4 per Hub, numbered 0-3): up to 4 DC motors. Encoder ports (4-pin JST-PH, 4 per Hub): for quadrature encoders, usable alongside the adjacent motor or with a standalone encoder. Servo ports (0.1\" header, 6 per Hub, numbered 0-5): watch polarity. +5V ports (0.1\" header, 2 per Hub): limited use, e.g. powered USB hubs. Analog ports (4-pin JST-PH, 2 per Hub, 4 channels each): for analog sensors like potentiometers. Digital ports (4-pin JST-PH, 4 per Hub, 8 channels): each port has two channels; sensors like REV's Touch Sensor only use one channel. I2C ports (4-pin JST-PH): each port is an independent I2C bus; using sensors with identical addresses on the same bus causes problems. RS485 (3-pin JST-PH): serial communication between REV Hubs. USB: USB 2.0 can cause Wi-Fi disconnects from electrostatic discharge — use the USB 3.0 port for cameras. USB-C: for programming from a laptop. Mini USB: firmware upload only."
    },

    difficulty: "N/A"
  },

{
  "id": "xt30_compressed_pins",
  "subsystem": [
    "power-wiring"
  ],
  "symptom_text": {
    "en": "The battery connector (XT30 port) on the Control Hub feels loose or wiggly.",
    "es": "El conector de batería (puerto XT30) del Control Hub se siente flojo o se mueve."
  },
  "tags": [
    "battery connector loose",
    "wiggly battery port",
    "xt30 loose",
    "battery plug wobbly",
    "conector se mueve",
    "conector de bateria flojo",
    "puerto de bateria flojo",
    "xt30 flojo",
    "conector bamboleante",
    "battery wont stay in",
    "loose battery connection",
    "bateria se sale",
    "battery falls out",
    "el cable de bateria se mueve"
  ],
  "fix": {
    "steps": {
      "en": [
        "The most common cause is compressed pins inside the male XT30 connector on your Hub.",
        "Each pin has 4 tines that should have a small amount of space between them. A pin can still be too compressed even if some space is visible.",
        "Use an X-ACTO knife or a similarly thin blade to slightly separate the tines. Work carefully: over-expanding the tines can stop the connector from fitting at all.",
        "After slightly separating the tines, the male and female XT30 connectors should connect more securely.",
        "Compressed or overextended pins are not covered under warranty, so go slowly and check the fit often."
      ],
      "es": [
        "La causa más común es que los pines dentro del conector XT30 macho de tu Hub estén comprimidos.",
        "Cada pin tiene 4 láminas que deben tener un poco de espacio entre ellas. Un pin puede seguir estando muy comprimido aunque se vea algo de espacio.",
        "Usa un cúter X-ACTO o una cuchilla igual de delgada para separar ligeramente las láminas. Hazlo con cuidado: si las separas demasiado, el conector puede dejar de encajar.",
        "Después de separar ligeramente las láminas, los conectores XT30 macho y hembra deberían quedar más firmes.",
        "Los pines comprimidos o sobre-expandidos no están cubiertos por la garantía, así que hazlo despacio y revisa el ajuste seguido."
      ]
    },
    "est_time": "10 min",
    "difficulty": "hard"
  },
  "edges": [
    {
      "answer": {
        "en": "This fixed it",
        "es": "Esto lo resolvió"

{
  "id": "brownout_fix",
  "subsystem": [
    "power-wiring"
  ],
  "symptom_text": {
    "en": "Pattern matches a brownout (power sag under load).",
    "es": "El patrón coincide con un brownout (caída de energía bajo carga)."
  },
  "tags": [
    "brownout",
    "battery care"
  ],
  "fix": {
    "steps": {
      "en": [
        "This pattern matches a brownout: certain mechanisms draw enough current to strain the battery.",
        "Before anything else, make sure the XT30 connector is fully seated and not loose, a loose connection makes voltage sag worse under load.",
        "If your team has a spare battery, try it. An older battery can look fully charged but still sag badly under load.",
        "Beyond that, REV's guidance is to follow proper battery care, covered in the battery documentation now included in this graph (see the battery and power section)."
      ],
      "es": [
        "Este patrón coincide con un brownout: ciertos mecanismos consumen suficiente corriente como para forzar la batería.",
        "Antes que nada, asegúrate de que el conector XT30 esté bien asentado y no flojo, una conexión floja empeora la caída de voltaje bajo carga.",
        "Si tu equipo tiene una batería de repuesto, pruébala. Una batería más vieja puede verse totalmente cargada pero aun así caer mucho bajo carga.",
        "Más allá de eso, la recomendación de REV es seguir el cuidado adecuado de la batería, cubierto en la documentación de batería ya incluida en este grafo (ver la sección de batería y energía)."
      ]
    }
  },
  "edges": [

{
  "id": "mech_direction_fix",
  "subsystem": [
    "programming-opmode"
  ],
  "symptom_text": {
    "en": "Motor or servo moves the opposite direction from what's expected.",
    "es": "El motor o servo se mueve en la dirección opuesta a la esperada."
  },
  "tags": [],
  "fix": {
    "steps": {
      "en": [
        "This is almost always a mounting or code direction setting, not a hardware fault, and the fix is available in all three programming environments.",
        "Blocks: for a DC motor, use the 'Set Direction' block for that motor (or the Direction dropdown inside the motor's config block) and switch it to Reverse. For a standard servo, swap the 0.0 and 1.0 values in your Set Position blocks instead of looking for a direction setting. For a CRServo, use a negative value in the Set Power block.",
        "OnBot Java and Android Studio (same Java syntax): for a DC motor, add motor.setDirection(DcMotor.Direction.REVERSE) in your initialization code. For a standard servo, swap your 0.0 and 1.0 target values in code instead of reversing a direction setting. For a continuous rotation servo (CRServo), use a negative power value instead of a positive one."
      ],
      "es": [
        "Esto casi siempre es un ajuste de montaje o de dirección en el código, no una falla de hardware, y el arreglo está disponible en los tres entornos de programación.",
        "Blocks: para un motor DC, usa el bloque 'Set Direction' de ese motor (o el menú desplegable de dirección dentro del bloque de configuración del motor) y cámbialo a Reverse. Para un servo estándar, intercambia los valores 0.0 y 1.0 en tus bloques de Set Position en vez de buscar una configuración de dirección. Para un CRServo, usa un valor negativo en el bloque de Set Power.",
        "OnBot Java y Android Studio (misma sintaxis de Java): para un motor DC, agrega motor.setDirection(DcMotor.Direction.REVERSE) en tu código de inicialización. Para un servo estándar, intercambia tus valores objetivo 0.0 y 1.0 en el código en lugar de invertir una configuración de dirección. Para un servo de rotación continua (CRServo), usa un valor de potencia negativo en lugar de positivo."
      ]
    },
    "est_time": "5 min",
    "difficulty": "easy"
  },
  "edges": [
    {
      "answer": {
        "en": "Fixed it",
        "es": "Se resolvió"
      },

    },

      },

{
  "id": "mech_distance_fix",
  "subsystem": [
    "programming-opmode",
    "motor-diagnostics"
  ],
  "symptom_text": {
    "en": "Motor moves the wrong distance or amount, for example overshooting or undershooting a target position.",
    "es": "El motor se mueve la distancia o cantidad incorrecta, por ejemplo pasándose o quedándose corto de una posición objetivo."
  },
  "tags": [],
  "fix": {
    "steps": {
      "en": [
        "If a motor overshoots or undershoots a target position, the most common cause is using the wrong encoder ticks-per-revolution for your gearbox. This applies the same way in all three environments, since the math is identical, only where you enter it changes.",
        "REV HD Hex motors use different tick counts depending on gear ratio: 560 ticks for 20:1, 1120 ticks for 40:1, 1680 ticks for 60:1. Confirm which gearbox your motor actually has, it's usually printed on the gearbox itself.",
        "Blocks: use the 'Set Mode' block to select RUN_TO_POSITION, a 'Set Target Position' block with the corrected tick count, and a 'Set Mode' block set to STOP_AND_RESET_ENCODER before the new target if the position needs to start fresh.",
        "OnBot Java and Android Studio (same Java syntax): make sure your target position math uses the matching tick count, and confirm you called motor.setMode(DcMotor.RunMode.STOP_AND_RESET_ENCODER) before setting a new target with setTargetPosition(...) and switching to RUN_TO_POSITION mode. Otherwise old encoder counts carry over."
      ],
      "es": [
        "Si un motor se pasa o se queda corto de una posición objetivo, la causa más común es usar el número incorrecto de ticks por revolución para tu caja de engranes. Esto aplica igual en los tres entornos, ya que la matemática es idéntica, solo cambia dónde la escribes.",
        "Los motores REV HD Hex usan distintos conteos de ticks según la relación de engranes: 560 ticks para 20:1, 1120 ticks para 40:1, 1680 ticks para 60:1. Confirma qué caja de engranes tiene realmente tu motor, normalmente está impreso en la caja misma.",
        "Blocks: usa el bloque 'Set Mode' para elegir RUN_TO_POSITION, un bloque 'Set Target Position' con el conteo de ticks correcto, y un bloque 'Set Mode' en STOP_AND_RESET_ENCODER antes del nuevo objetivo si la posición necesita empezar de cero.",
        "OnBot Java y Android Studio (misma sintaxis de Java): asegúrate de que el cálculo de posición objetivo use el conteo de ticks correcto, y confirma que llamaste a motor.setMode(DcMotor.RunMode.STOP_AND_RESET_ENCODER) antes de fijar un nuevo objetivo con setTargetPosition(...) y cambiar a modo RUN_TO_POSITION. Si no, los conteos anteriores del encoder se acumulan."
      ]
    },
    "est_time": "10 min",
    "difficulty": "medium"
  },
  "edges": [
    {
      "answer": {
        "en": "Fixed it",
        "es": "Se resolvió"
      },

    },

        "es": "Sigue mal después de esto"
      },
      "next_node_id": "esc-team-mexico"
    }
  ],

    "en": "Turn value shows nonzero even without touching the turn stick.",

  "fix": {
    "steps": {
      "en": [
        "If the turn axis shows a small nonzero value even when you're not touching it, that's joystick drift, common on well-used gamepads. This is a physical property of the gamepad, so it shows up the same way regardless of environment.",
        "Small amounts are usually fine to ignore. If it's large, add a deadzone: only apply the turn value if it's beyond a small threshold, like 0.05.",
        "Blocks: wrap the turn value in an 'if absolute value of turn > 0.05' block before using it, otherwise use 0.",
        "OnBot Java and Android Studio (same Java syntax): add a check like if (Math.abs(turn) < 0.05) turn = 0; before applying it to the motors."
      ],
      "es": [
        "Si el eje de giro muestra un valor pequeño distinto de cero aunque no lo toques, eso es deriva del joystick (drift), común en controles muy usados. Es una propiedad física del control, así que se ve igual sin importar el entorno.",
        "Cantidades pequeñas normalmente se pueden ignorar. Si es grande, agrega una zona muerta: solo aplica el valor de giro si supera un umbral pequeño, como 0.05.",
        "Blocks: envuelve el valor de giro en un bloque 'if valor absoluto de giro > 0.05' antes de usarlo, si no, usa 0.",
        "OnBot Java y Android Studio (misma sintaxis de Java): agrega una revisión como if (Math.abs(turn) < 0.05) turn = 0; antes de aplicarlo a los motores."
      ]
    },
    "est_time": "10 min",

        "Instead of checking exact RGB numbers, compare the ratios between red, green, and blue, that tends to stay more consistent across lighting conditions. In Blocks, build this with math blocks (divide red by the sum, for example); in OnBot Java or Android Studio, do the same division directly in code."
      ],
      "es": [
        "Los sensores de color son muy sensibles a la luz ambiental. El mismo objeto puede dar valores RGB distintos en un cuarto muy iluminado que en una esquina con sombra. Esto es un problema de iluminación, no de programación, así que el arreglo es la misma idea en Blocks, OnBot Java y Android Studio.",
        "En lugar de revisar números RGB exactos, compara las proporciones entre rojo, verde y azul, eso se mantiene más consistente entre distintas condiciones de luz. En Blocks, arma esto con bloques de matemáticas (divide rojo entre la suma, por ejemplo); en OnBot Java o Android Studio, haz la misma división directamente en el código."
      ]
    }

{
  "id": "safe_testing_checklist",
  "subsystem": [
    "programming-opmode",
    "motor-diagnostics"
  ],
  "symptom_text": {
    "en": "Reference: how to safely test motors, servos, and sensors before running the full robot.",
    "es": "Referencia: cómo probar de forma segura motores, servos y sensores antes de correr el robot completo."
  },
  "tags": [
    "how to test hardware safely",
    "como probar el hardware",
    "testing checklist",
    "lista de pruebas",
    "safe motor test",
    "prueba segura del robot"
  ],
  "fix": {
    "steps": {
      "en": [
        "Check connections first: every motor, servo, and sensor firmly plugged in, cables not frayed or loose, and the Robot Controller configuration names matching your code exactly.",
        "Start with telemetry before moving anything: print initial values so you know the robot is communicating.",
        "Test motors one at a time, starting at low power (about 0.2 to 0.3), confirming direction and listening for unusual noise or binding before increasing power.",
        "Test servos slowly through their range, and CRServos at low power, watching for mechanical resistance, never force a servo by hand while it's powered.",
        "Test sensors in isolation with nothing moving, and confirm the readings are reasonable for what you're measuring.",
        "Test one subsystem at a time (drivetrain, then intake, then arm, and so on), not everything at once.",
        "Keep the robot secure and clear of edges, wheels tied off or lifted for drivetrain tests, and everyone standing clear of moving parts.",
        "Know your emergency stop: release the joysticks, press stop on the Driver Station, or power down the Hub if needed.",
        "Log what you find: motor directions, servo ranges, sensor readings, so you don't have to rediscover it next time."
      ],
      "es": [
        "Revisa las conexiones primero: cada motor, servo y sensor bien conectado, cables sin deshilachar ni flojos, y los nombres de la configuración del Robot Controller coincidiendo exactamente con tu código.",
        "Empieza con telemetría antes de mover nada: imprime valores iniciales para saber que el robot se está comunicando.",
        "Prueba los motores uno por uno, empezando con poca potencia (entre 0.2 y 0.3), confirmando la dirección y escuchando ruidos raros o atascos antes de subir la potencia.",
        "Prueba los servos despacio en todo su rango, y los CRServos con poca potencia, viendo si hay resistencia mecánica, nunca fuerces un servo con la mano mientras tiene energía.",
        "Prueba los sensores por separado sin que nada se mueva, y confirma que las lecturas tengan sentido para lo que estás midiendo.",
        "Prueba un subsistema a la vez (tracción, luego intake, luego brazo, etc.), no todo junto.",
        "Mantén el robot seguro y lejos de bordes, ruedas amarradas o levantadas para pruebas de tracción, y todos alejados de las partes móviles.",
        "Conoce tu paro de emergencia: soltar los joysticks, presionar stop en el Driver Station, o apagar el Hub si hace falta.",
        "Registra lo que encuentres: direcciones de motores, rangos de servos, lecturas de sensores, para no tener que redescubrirlo la próxima vez."
      ]
    }
  },

{
  "id": "code_organization_help",
  "subsystem": [
    "programming-opmode"
  ],
  "symptom_text": {
    "en": "The code is hard to debug because everything is written in one giant file.",
    "es": "El código es difícil de depurar porque todo está escrito en un solo archivo enorme."
  },
  "tags": [
    "code is a mess",
    "one giant file",
    "cant find the bug in my code",
    "codigo desordenado",
    "todo en un archivo",
    "no encuentro el error en mi codigo",
    "how to organize robot code"
  ],
  "fix": {
    "steps": {
      "en": [
        "This usually isn't a bug, it's a sign the code needs better structure. This applies to OnBot Java and Android Studio, since both support full Java classes.",
        "Break the robot into subsystem classes (Drivetrain, Arm, Intake, Claw), each responsible for its own motors, servos, and methods.",
        "The OpMode should then just create one object per subsystem and call simple methods like drivetrain.drive(...) or arm.liftUp(), instead of touching motor.setPower() directly everywhere.",
        "This makes it far easier to know which class to check when something breaks, and lets different team members work on different subsystems without conflicting.",
        "Blocks note: Blocks doesn't support custom classes, so this exact pattern doesn't transfer directly. The closest equivalent is MyBlocks, grouping repeated sequences of blocks into a single reusable custom block, which helps organize a long program even without full subsystem objects."
      ],
      "es": [
        "Esto normalmente no es un bug, es una señal de que el código necesita mejor estructura. Esto aplica a OnBot Java y Android Studio, ya que ambos soportan clases completas de Java.",
        "Divide el robot en clases por subsistema (Drivetrain, Arm, Intake, Claw), cada una responsable de sus propios motores, servos y métodos.",
        "El OpMode entonces solo debería crear un objeto por subsistema y llamar métodos simples como drivetrain.drive(...) o arm.liftUp(), en lugar de tocar motor.setPower() directamente en todos lados.",
        "Esto hace mucho más fácil saber qué clase revisar cuando algo se rompe, y permite que distintos miembros del equipo trabajen en distintos subsistemas sin pisarse.",
        "Nota para Blocks: Blocks no soporta clases personalizadas, así que este patrón exacto no se traslada directamente. El equivalente más cercano es MyBlocks, agrupar secuencias repetidas de bloques en un bloque personalizado reutilizable, lo cual ayuda a organizar un programa largo aunque no haya objetos de subsistema completos."
      ]
    }
  },
  "edges": [],
  "metadata": {

  "subsystem": [

  "symptom_text": {
    "en": "Documented steps didn't resolve a connectivity issue.",
    "es": "Los pasos documentados no resolvieron un problema de conectividad."
  },
  "tags": [],
  "fix": {
    "steps": {
      "en": [
        "Try a different USB cable if you have one. Some cables only carry power, not data, and won't work for this.",
        "Try a different USB port on your computer.",
        "Unplug and firmly reinsert the cable at both ends. It's easy for a cable to look plugged in while only making partial contact.",
        "If you're using a micro-USB cable, try flipping the connector over. Inserting it upside down against resistance is a common mistake.",
        "Power-cycle the Control Hub and restart the computer or Driver Station device you're connecting from.",
        "Rule out a one-time glitch: wait about 30 seconds and try connecting again.",
        "If you have access to a second computer or Android device, try connecting from that to see if the problem follows the Hub or the other device."
      ],
      "es": [
        "Prueba con otro cable USB si tienes uno. Algunos cables solo llevan energía, no datos, y no van a funcionar para esto.",
        "Prueba con otro puerto USB de tu computadora.",
        "Desconecta y vuelve a conectar firmemente el cable en ambos extremos. Es fácil que un cable se vea conectado pero solo haga contacto parcial.",
        "Si usas un cable micro-USB, intenta voltear el conector. Insertarlo al revés forzándolo es un error común.",
        "Apaga y enciende el Control Hub y reinicia la computadora o el dispositivo Driver Station desde el que te estás conectando.",
        "Descarta que sea un fallo momentáneo: espera unos 30 segundos e intenta conectarte de nuevo.",
        "Si tienes acceso a otra computadora o dispositivo Android, intenta conectarte desde ahí para ver si el problema sigue al Hub o al otro dispositivo."

        "With the robot powered off, try turning the gearbox gently by hand to feel whether it's jammed or a gear has stripped or broken.",

        "If you have a spare, known-good motor, swap it onto this port to check whether the problem is the motor itself or something mechanical downstream."

        "Con el robot apagado, intenta girar la caja de engranes suavemente con la mano para sentir si está atorada o si un engrane se peló o se rompió.",

        "Blocks hides device-specific blocks until a configuration exists for that device. If you don't see a DcMotor or Servo menu, it's almost never a bug in your program — it means that motor or servo isn't configured and active yet.",

        "If the device is an I2C sensor (like a color or distance sensor), remember Bus 0 is reserved for the Control Hub's built-in IMU — use a different bus for your sensor."

<script>
(function () {
  "use strict";

  function detectLang() {
    try {
      const saved = localStorage.getItem("tm_lang");
      if (saved && UI_STRINGS[saved]) return saved;
    } catch (e) {}
    const nav = (navigator.language || "en").toLowerCase();
    if (nav.startsWith("es")) return "es";
    if (nav.startsWith("fr")) return "fr";
    if (nav.startsWith("ar")) return "ar";
    return "en";
  }

  function detectTheme() {
    try {
      const saved = localStorage.getItem("tm_theme");
      if (saved === "light" || saved === "dark") return saved;
    } catch (e) {}
    if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) return "dark";
    return "light";
  }

  let currentTheme = detectTheme();

  let currentLang = detectLang();
  let currentNodeId = null;      // active node id, or "END"
  let view = "landing";          // "landing" | "node"
  let historyStack = [];         // previous node ids ("__HOME__" marks landing as the parent)

  const root = document.getElementById("app-root");

  // ---------------- text / data helpers ----------------

  const LANG_FALLBACK = ["es", "en", "fr", "ar"]; // used only when currentLang === "es"

  function pickText(field) {
    if (!field) return "";
    if (field[currentLang]) return field[currentLang];
    // Content fallback: user's language -> English -> Spanish -> anything else.
    // (Spanish is tried first only when Spanish IS the selected language, since almost
    // every node has es+en filled in but few have fr/ar yet. For fr/ar users this means
    // falling back to English rather than Spanish, matching the project's stated policy.)
    const order = currentLang === "es" ? LANG_FALLBACK : ["en", "es", "fr", "ar"];
    for (const l of order) if (field[l]) return field[l];
    const firstKey = Object.keys(field)[0];
    return firstKey ? field[firstKey] : "";
  }

  function ui(key) {
    const dict = UI_STRINGS[currentLang] || UI_STRINGS.en;
    return dict[key] != null ? dict[key] : (UI_STRINGS.en[key] || "");
  }

  function findNode(id) {
    return NODES.find((n) => n.id === id) || null;
  }

  function isRTL() {
    return RTL_LANGS.indexOf(currentLang) !== -1;
  }

  function normalize(str) {
    return (str || "")
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/[^\p{L}\p{N}\s]/gu, " ")
      .replace(/\s+/g, " ")
      .trim();
  }

  function levenshtein(a, b) {
    const m = a.length, n = b.length;
    if (!m) return n;
    if (!n) return m;
    const row = new Array(n + 1);
    for (let j = 0; j <= n; j++) row[j] = j;
    for (let i = 1; i <= m; i++) {
      let prev = row[0];
      row[0] = i;
      for (let j = 1; j <= n; j++) {
        const tmp = row[j];
        row[j] = a[i - 1] === b[j - 1] ? prev : 1 + Math.min(prev, row[j], row[j - 1]);
        prev = tmp;
      }
    }
    return row[n];
  }

  function difficultyLabel(raw) {
    if (!raw) return null;
    const k = String(raw).toLowerCase();
    if (k === "easy") return ui("diffEasy");
    if (k === "medium") return ui("diffMedium");
    if (k === "hard") return ui("diffHard");
    if (k === "n/a") return ui("diffNA");
    return raw;
  }

  // ---------------- search ----------------

  function searchEligible(node) {
    if (node.id === "root") return false;
    if (node.subsystem && node.subsystem.indexOf("escalation") !== -1) return false;
    if (node.metadata && node.metadata.is_entry_point === false) return false;
    return true;
  }

  function scoreNode(inputNorm, inputTokens, node) {
    let score = 0;
    const tagPhrases = (node.tags || []).map(normalize).filter(Boolean);
    const symptomEs = normalize((node.symptom_text && node.symptom_text.es) || "");
    const symptomEn = normalize((node.symptom_text && node.symptom_text.en) || "");

    tagPhrases.forEach((phrase) => {
      if (!phrase) return;
      if (inputNorm.indexOf(phrase) !== -1 || phrase.indexOf(inputNorm) !== -1) score += 5;
    });

    const corpus = (tagPhrases.join(" ") + " " + symptomEs + " " + symptomEn).split(" ").filter(Boolean);
    const corpusSet = new Set(corpus);

    inputTokens.forEach((tok) => {
      if (tok.length < 2) return;
      if (corpusSet.has(tok)) { score += 2; return; }
      let best = Infinity;
      corpus.forEach((ct) => {
        if (Math.abs(ct.length - tok.length) > 2) return;
        const d = levenshtein(tok, ct);
        if (d < best) best = d;
      });
      const threshold = tok.length <= 4 ? 1 : 2;
      if (best <= threshold) score += 1;
    });

    return score;
  }

  function searchNodes(raw) {
    const inputNorm = normalize(raw);
    if (!inputNorm) return [];
    const inputTokens = inputNorm.split(" ").filter(Boolean);
    const scored = NODES.filter(searchEligible).map((n) => ({ node: n, score: scoreNode(inputNorm, inputTokens, n) }));
    scored.sort((a, b) => b.score - a.score);
    return scored.filter((s) => s.score > 0).slice(0, 6);
  }

  // ---------------- navigation ----------------

  function enterFromLanding(nodeId) {
    historyStack = [];
    currentNodeId = nodeId;
    view = "node";
    renderApp();
    window.scrollTo({ top: 0, behavior: "auto" });
  }

  function goToEdge(nextId) {
    if (nextId === "__HOME__") { goHome(); return; }
    if (nextId === "END") {
      historyStack.push(currentNodeId);
      currentNodeId = "END";
      renderApp();
      window.scrollTo({ top: 0, behavior: "auto" });
      return;
    }
    historyStack.push(currentNodeId);
    currentNodeId = nextId;
    renderApp();
    window.scrollTo({ top: 0, behavior: "auto" });
  }

  function goBack() {
    if (!historyStack.length) { goHome(); return; }
    currentNodeId = historyStack.pop();
    view = "node";
    renderApp();
    window.scrollTo({ top: 0, behavior: "auto" });
  }

  function goHome() {
    view = "landing";
    currentNodeId = null;
    historyStack = [];
    renderApp();
    requestAnimationFrame(() => window.scrollTo({ top: 0, behavior: "auto" }));
  }

  function setLang(lang) {
    if (!UI_STRINGS[lang]) return;
    currentLang = lang;
    try { localStorage.setItem("tm_lang", lang); } catch (e) {}
    document.documentElement.lang = lang;
    document.documentElement.dir = isRTL() ? "rtl" : "ltr";
    renderApp();
  }

  function applyTheme() {
    document.documentElement.setAttribute("data-theme", currentTheme);
  }

  function setTheme(theme) {
    if (theme !== "light" && theme !== "dark") return;
    currentTheme = theme;
    try { localStorage.setItem("tm_theme", theme); } catch (e) {}
    applyTheme();
    renderApp();
  }

  function toggleTheme() {
    setTheme(currentTheme === "dark" ? "light" : "dark");
  }

  function logoSrc() {
    return currentTheme === "dark" ? LOGO_WHITE_SRC : LOGO_BLACK_SRC;
  }

  // expose for inline handlers
  window.__tm = { enterFromLanding, goToEdge, goBack, goHome, setLang, setTheme, toggleTheme };

  // ---------------- small render helpers ----------------

  function el(html) {
    const t = document.createElement("template");
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }

  function icon(name, extraClass) {
    return '<span class="' + (extraClass || "") + '">' + (ICONS[name] || "") + "</span>";
  }

  function themeToggleButton(extraClass) {
    return (
      '<button class="theme-toggle ' + (extraClass || "") + '" onclick="__tm.toggleTheme()" aria-label="' + ui("themeToggleLabel") + '">' +
        (currentTheme === "dark" ? ICONS.sun : ICONS.moon) +
      "</button>"
    );
  }

  // Splits UI copy into individually-animated word spans for the hero title
  // reveal. Words carry their own animation-delay so they cascade in.
  function wordsHTML(text, baseDelayMs, stepMs) {
    const words = text.split(" ");
    return words.map((w, i) =>
      '<span class="word" style="animation-delay:' + (baseDelayMs + i * (stepMs || 90)) + 'ms">' + w + (i < words.length - 1 ? "&nbsp;" : "") + "</span>"
    ).join("");
  }

  const STEP_DIVIDER_SVG =
    '<svg viewBox="0 0 1200 34" preserveAspectRatio="none" aria-hidden="true">' +
      '<path class="trace-line" d="M0,17 H620 L636,3 L652,31 L668,17 H1200" />' +
      '<g class="step-mark">' +
        '<rect x="633" y="25" width="18" height="3"></rect>' +
        '<rect x="636.5" y="20.5" width="11" height="3"></rect>' +
        '<rect x="639.5" y="16" width="5" height="3"></rect>' +
      "</g>" +
      '<circle class="pulse-dot" r="3.2"></circle>' +
    "</svg>";

  // ---------------- LANDING VIEW ----------------

  function renderLanding() {
    const rootNode = findNode("root");
    const cards = (rootNode ? rootNode.edges : []).map((e) => {
      const target = findNode(e.next_node_id);
      const iconKey = SUBSYSTEM_ICON[e.next_node_id] || "code";
      return (
        '<button class="robot-card notch-card" onclick="__tm.enterFromLanding(\'' + e.next_node_id + '\')">' +
          '<span class="icon-wrap">' + (ICONS[iconKey] || "") + "</span>" +
          '<span class="label">' + pickText(e.answer) + "</span>" +
        "</button>"
      );
    }).join("");

    root.innerHTML =
      '<div class="top-controls">' +
        '<div class="lang-bar" role="group" aria-label="Language">' +
          LANG_ORDER.map((l) =>
            '<button class="lang-btn" aria-pressed="' + (l === currentLang) + '" onclick="__tm.setLang(\'' + l + '\')">' + l.toUpperCase() + "</button>"
          ).join("") +
        "</div>" +
        themeToggleButton() +
      "</div>" +

      '<section class="hero">' +
        '<div class="circuit-field"></div>' +
        '<div class="hero-glow"></div>' +
        '<div class="hero-logo-wrap">' +
          '<div class="hero-logo-ring"></div>' +
          '<img class="hero-logo" src="' + logoSrc() + '" alt="Team Mexico" />' +
        "</div>" +
        '<p class="hero-eyebrow">' + ui("heroEyebrow") + "</p>" +
        '<h1 class="hero-title">' + wordsHTML(ui("heroTitle"), 620) + '<br><span class="hero-subtitle">' + ui("heroSubtitle") + "</span></h1>" +
        '<div class="hero-thread-wrap">' +
          '<div class="tricolor-thread"><span class="t-green"></span><span class="t-white"></span><span class="t-red"></span></div>' +
        "</div>" +
        '<p class="hero-desc">' + ui("heroDesc") + "</p>" +
        '<div class="scroll-cue" aria-hidden="true">' + icon("arrow", "scroll-icon") + '<span>' + ui("scrollCue") + "</span></div>" +
      "</section>" +

      '<div class="step-divider">' + STEP_DIVIDER_SVG + "</div>" +

      '<section class="section section-narrow">' +
        '<div class="section-inner reveal">' +
          '<p class="section-kicker"><span class="dot"></span>' + ui("searchKicker") + "</p>" +
          '<h2 class="section-title">' + ui("searchTitle") + "</h2>" +
          '<p class="section-lede">' + ui("searchLede") + "</p>" +
          '<div class="search-shell">' +
            '<div class="search-input-wrap">' +
              icon("search", "search-icon") +
              '<input id="searchInput" type="text" autocomplete="off" placeholder="' + ui("searchPlaceholder") + '" />' +
            "</div>" +
            '<div class="search-results" id="searchResults"></div>' +
          "</div>" +
        "</div>" +
      "</section>" +

      '<section class="section">' +
        '<div class="section-inner reveal">' +
          '<p class="section-kicker"><span class="dot"></span>' + ui("robotKicker") + "</p>" +
          '<h2 class="section-title">' + ui("robotTitle") + "</h2>" +
          '<p class="section-lede">' + ui("robotLede") + "</p>" +
          '<div class="robot-grid reveal-stagger">' + cards + "</div>" +
        "</div>" +
      "</section>" +

      '<footer class="site-footer">' +
        '<img src="' + logoSrc() + '" alt="Team Mexico" />' +
      "</footer>";

    wireSearch();
    initReveal();
  }

  function wireSearch() {
    const input = document.getElementById("searchInput");
    const results = document.getElementById("searchResults");
    if (!input) return;
    input.addEventListener("input", () => {
      const val = input.value;
      const matches = searchNodes(val);
      if (!val.trim()) { results.innerHTML = ""; return; }
      if (!matches.length) {
        results.innerHTML = '<p class="search-empty-hint">' + ui("searchNoResults") + "</p>";
        return;
      }
      results.innerHTML = matches.map((m, i) =>
        '<button class="search-result-row notch-card" style="animation-delay:' + (i * 35) + 'ms" onclick="__tm.enterFromLanding(\'' + m.node.id + '\')">' +
          '<span>' + pickText(m.node.symptom_text) + "</span>" +
          icon("arrow", "arrow") +
        "</button>"
      ).join("");
    });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        const matches = searchNodes(input.value);
        if (matches.length) enterFromLanding(matches[0].node.id);
      }
    });
  }

  function initReveal() {
    const targets = document.querySelectorAll(".reveal, .reveal-stagger");
    if (!("IntersectionObserver" in window)) {
      targets.forEach((t) => t.classList.add("is-visible"));
      return;
    }
    const io = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add("is-visible");
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12, rootMargin: "0px 0px -60px 0px" });
    targets.forEach((t) => io.observe(t));
  }

  // ---------------- TROUBLESHOOTING (NODE) VIEW ----------------

  function renderHeader() {
    return (
      '<header class="tm-header">' +
        '<div class="tm-header-title">' + ui("headerTitle") + ' <span class="dim">— ' + ui("headerTitleSub") + "</span></div>" +
        '<nav class="tm-nav">' +
          '<button class="btn" onclick="__tm.goBack()" ' + (historyStack.length ? "" : "disabled") + ">" + icon("back") + "<span>" + ui("backBtn") + "</span></button>" +
          '<button class="btn" onclick="__tm.goHome()">' + icon("home") + "<span>" + ui("homeBtn") + "</span></button>" +
          themeToggleButton() +
        "</nav>" +
      "</header>"
    );
  }

  function renderBreadcrumb() {
    const prevId = historyStack.length ? historyStack[historyStack.length - 1] : "__HOME__";
    const prevLabel = prevId === "__HOME__" ? ui("breadcrumbHome") : pickText((findNode(prevId) || {}).symptom_text);
    return (
      '<div class="breadcrumb">' +
        '<span class="crumb-prev">' + prevLabel + "</span>" +
        icon("chev", "chev") +
        '<span class="crumb-current">' + pickText((findNode(currentNodeId) || {}).symptom_text) + "</span>" +
      "</div>"
    );
  }

  function renderMetaRow(node) {
    const chips = [];
    if (node.fix) {
      if (node.fix.est_time && node.fix.est_time !== "N/A") {
        chips.push('<span class="tag">' + ui("estTimeLabel") + ": " + node.fix.est_time + "</span>");
      }
      const diff = difficultyLabel(node.fix.difficulty);
      if (diff && diff !== "—") {
        chips.push('<span class="tag">' + ui("difficultyLabel") + ": " + diff + "</span>");
      }
    }
    if (node.metadata && node.metadata.verified === false) {
      chips.push('<span class="tag tag-review">' + ui("reviewTag") + "</span>");
    }
    return chips.length ? '<div class="node-meta-row">' + chips.join("") + "</div>" : "";
  }

  function renderSourceLine(node) {
    if (!node.metadata || !node.metadata.contributor) return "";
    return '<p class="source-line">' + ui("sourceLabel") + ": " + node.metadata.contributor + "</p>";
  }

  function renderEdges(node) {
    if (!node.edges || !node.edges.length) return "";
    return (
      '<div class="edges">' +
        node.edges.map((e) =>
          '<button class="edge-btn" onclick="__tm.goToEdge(\'' + e.next_node_id + '\')">' +
            "<span>" + pickText(e.answer) + "</span>" +
            icon("arrow", "arrow") +
          "</button>"
        ).join("") +
      "</div>"
    );
  }

  function fixStepsHTML(node) {
    if (!node.fix) return "";
    const val = pickText(node.fix.steps);
    if (Array.isArray(val)) {
      return "<ol>" + val.map((s) => "<li>" + s + "</li>").join("") + "</ol>";
    }
    return "<p>" + val + "</p>";
  }

  function renderStandardNode(node) {
    let html = "";
    html += renderBreadcrumb();
    html += '<h1 class="node-title">' + pickText(node.symptom_text) + "</h1>";

    if (node.fix) {
      html += '<div class="node-fix">' + fixStepsHTML(node) + renderMetaRow(node) + renderSourceLine(node) + "</div>";
    }
    if (node.check && node.check.question) {
      html += '<p class="node-question">' + pickText(node.check.question) + "</p>";
    }
    if (!node.fix && node.metadata && node.metadata.verified === false) {
      html += renderMetaRow(node);
    }
    html += renderEdges(node);
    return html;
  }

  function renderPortReferenceNode(node) {
    let html = "";
    html += renderBreadcrumb();
    html += '<h1 class="node-title">' + pickText(node.symptom_text) + "</h1>";
    html +=
      '<figure class="port-figure">' +
        '<img src="' + PORT_DIAGRAM_SRC + '" alt="REV Control Hub port diagram" onclick="__tm.openLightbox()" />' +
        '<figcaption class="port-caption">REV Robotics — Control Hub Port Reference</figcaption>' +
      "</figure>" +
      '<div class="port-legend"><p>' + pickText(node.fix ? node.fix.steps : node.symptom_text) + "</p></div>";
    html += renderSourceLine(node);
    html += renderEdges(node);
    return html;
  }

  function renderGapState(node) {
    let html = "";
    html += renderBreadcrumb();
    html +=
      '<div class="gap-panel">' +
        '<div class="state-icon">' + icon("contact") + "</div>" +
        '<h1 class="gap-title">' + ui("gapTitle") + "</h1>" +
        '<p class="gap-desc">' + ui("gapDesc") + "</p>" +
        '<div class="gap-cards">' +
          '<a class="gap-card notch-card" href="https://www.instagram.com/teammexicofgc" target="_blank" rel="noopener">' +
            '<span class="gap-icon">' + ICONS.instagram + "</span>" +
            '<span><span class="gap-card-title">' + ui("gapInstagramTitle") + '</span><br><span class="gap-card-sub">' + ui("gapInstagramSub") + "</span></span>" +
          "</a>" +
          '<a class="gap-card notch-card" href="https://teammexico.gitbook.io/teammexico-docs" target="_blank" rel="noopener">' +
            '<span class="gap-icon">' + ICONS.docs + "</span>" +
            '<span><span class="gap-card-title">' + ui("gapDocsTitle") + '</span><br><span class="gap-card-sub">' + ui("gapDocsSub") + "</span></span>" +
          "</a>" +
        "</div>" +
      "</div>";
    html += renderEdges(node);
    return html;
  }

  function renderResolvedState() {
    return (
      '<div class="state-card state-resolved">' +
        '<div class="state-icon">' + icon("check") + "</div>" +
        '<h1 class="state-title">' + ui("resolvedTitle") + "</h1>" +
        '<p class="state-desc">' + ui("resolvedDesc") + "</p>" +
        '<button class="btn btn-primary" onclick="__tm.goHome()">' + icon("home") + "<span>" + ui("resolvedBtn") + "</span></button>" +
      "</div>"
    );
  }

  function renderNodeView() {
    let inner;
    if (currentNodeId === "END") {
      inner = renderResolvedState();
    } else {
      const node = findNode(currentNodeId);
      if (!node) {
        inner = "<p>Node not found: " + currentNodeId + "</p>";
      } else if (node.id === "esc-team-mexico") {
        inner = renderGapState(node);
      } else if (node.id === "controlhub-ports-reference") {
        inner = renderPortReferenceNode(node);
      } else {
        inner = renderStandardNode(node);
      }
    }
    root.innerHTML = renderHeader() + '<main class="node-wrap">' + inner + "</main>" + renderLightbox();
    wireLightbox();
  }

  // ---------------- lightbox (port diagram zoom) ----------------

  function renderLightbox() {
    return (
      '<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Enlarged image">' +
        '<img src="' + PORT_DIAGRAM_SRC + '" alt="REV Control Hub port diagram, enlarged" />' +
      "</div>"
    );
  }
  function wireLightbox() {
    const lb = document.getElementById("lightbox");
    if (!lb) return;
    lb.addEventListener("click", () => lb.classList.remove("is-open"));
    document.addEventListener("keydown", escCloseLightbox);
  }
  function escCloseLightbox(e) {
    if (e.key === "Escape") {
      const lb = document.getElementById("lightbox");
      if (lb) lb.classList.remove("is-open");
    }
  }
  window.__tm.openLightbox = function () {
    const lb = document.getElementById("lightbox");
    if (lb) lb.classList.add("is-open");
  };

  // ---------------- top-level render ----------------

  function renderApp() {
    document.documentElement.lang = currentLang;
    document.documentElement.dir = isRTL() ? "rtl" : "ltr";
    if (view === "landing") {
      renderLanding();
    } else {
      renderNodeView();
    }
  }

  document.documentElement.lang = currentLang;
  document.documentElement.dir = isRTL() ? "rtl" : "ltr";
  applyTheme();
  renderApp();
})();

</script>

</body>
</html>
